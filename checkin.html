<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Check-in · L-Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">L<span>·</span>Dashboard</a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <rect y="3" width="20" height="2" rx="1"/>
          <rect y="9" width="20" height="2" rx="1"/>
          <rect y="15" width="20" height="2" rx="1"/>
        </svg>
      </button>
      <nav class="site-header__nav" id="site-nav">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link active" href="checkin.html">Check-in</a>
        <a class="nav-link" href="workout.html">Workout</a>
        <a class="nav-link" href="body.html">Body</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main class="site-main" id="checkin-root">

    <h1 class="page-title">Daily Check-in</h1>
    <p class="page-subtitle" id="checkin-date">Loading…</p>

    <!-- Form — always editable, pre-fills if entry exists -->
    <form class="checkin-form" id="checkin-form" novalidate>

      <!-- Body section -->
      <div class="form-section">
        <div class="form-section-title">Body</div>

        <div class="field-row">
          <div class="field">
            <label for="field-weight">Weight (lbs)</label>
            <input type="number" id="field-weight" name="weight" step="0.1" min="50" max="500" placeholder="e.g. 172.4" />
          </div>
          <div class="field">
            <label for="field-water">Water (oz)</label>
            <input type="number" id="field-water" name="water_oz" step="1" min="0" max="300" placeholder="e.g. 80" />
          </div>
        </div>

        <div class="field-row field-row--3">
          <div class="field">
            <label for="field-sleep">Sleep (hrs)</label>
            <input type="number" id="field-sleep" name="sleep_hrs" step="0.5" min="0" max="24" placeholder="e.g. 7.5" />
          </div>
          <div class="field">
            <label>Sleep quality</label>
            <!-- reversed so CSS :checked ~ label highlights correctly -->
            <div class="star-rating" role="group" aria-label="Sleep quality 1 to 5">
              <input type="radio" id="star-5" name="sleep_quality" value="5" />
              <label for="star-5" title="5 — Excellent">★</label>
              <input type="radio" id="star-4" name="sleep_quality" value="4" />
              <label for="star-4" title="4 — Good">★</label>
              <input type="radio" id="star-3" name="sleep_quality" value="3" />
              <label for="star-3" title="3 — OK">★</label>
              <input type="radio" id="star-2" name="sleep_quality" value="2" />
              <label for="star-2" title="2 — Poor">★</label>
              <input type="radio" id="star-1" name="sleep_quality" value="1" />
              <label for="star-1" title="1 — Terrible">★</label>
            </div>
          </div>
          <div class="field">
            <label for="field-calories">Calories (estimated)</label>
            <input type="number" id="field-calories" name="calories" step="1" min="0" max="10000" placeholder="e.g. 2100" />
          </div>
        </div>

        <!-- Food log + AI estimate -->
        <div class="field">
          <label for="field-food-log">Food log <span style="font-weight:400;text-transform:none;letter-spacing:0">(describe what you ate — AI can estimate calories)</span></label>
          <textarea id="field-food-log" name="food_log" placeholder="e.g. Oatmeal with berries for breakfast, chicken wrap for lunch, salmon + rice for dinner, handful of almonds…" style="min-height:70px;"></textarea>
          <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
            <button class="btn btn--secondary" id="ai-estimate-btn" type="button" style="display:none; font-size:0.78rem; padding:7px 14px;">Estimate with AI</button>
            <span class="card-meta" id="ai-estimate-note" style="font-size:0.72rem;"></span>
          </div>
        </div>
      </div>

      <!-- Supplements section -->
      <div class="form-section">
        <div class="form-section-title">Supplements</div>
        <div id="supplement-checks">
          <!-- rendered by app.js into morning/evening groups -->
        </div>
      </div>

      <!-- Habits section -->
      <div class="form-section">
        <div class="form-section-title">Habits</div>
        <div class="check-list" id="habit-checks">
          <!-- rendered by app.js from CONFIG.HABITS -->
        </div>
      </div>

      <!-- Notes section -->
      <div class="form-section">
        <div class="form-section-title">Notes</div>
        <div class="field">
          <label for="field-notes">Anything else — workout, mood, observations</label>
          <textarea id="field-notes" name="notes" placeholder="e.g. Hit the gym, felt tired mid-afternoon, good focus session at night…"></textarea>
        </div>
      </div>

      <!-- Submit -->
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div class="submit-banner" id="result-banner"></div>
        <div>
          <button class="btn btn--primary" id="submit-btn" type="submit">Submit Check-in</button>
        </div>
      </div>

    </form>
  </main>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
